name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesRepository: ${{ github.repository }}
        run: ./gradlew clean :patches:buildAndroid

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ vars.GPG_FINGERPRINT }}

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesRepository: ${{ github.repository }}

      - name: Update manager-patches.json
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const tag = "${{ steps.release.outputs.new_release_git_tag }}";

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag,
            });

            const createdAtRaw = release.published_at ?? release.created_at;
            const createdAt = (createdAtRaw ?? new Date().toISOString())
              .replace(/\.\d+Z$/, "")
              .replace(/Z$/, "");

            const rvpAsset = release.assets.find(
              (asset) => asset.name.endsWith(".rvp") && !asset.name.endsWith(".rvp.asc"),
            );

            if (!rvpAsset) {
              core.setFailed(`Could not find .rvp asset for ${tag}.`);
              return;
            }

            const signatureAsset = release.assets.find((asset) =>
              asset.name.endsWith(".rvp.asc"),
            );

            const payload = {
              download_url: rvpAsset.browser_download_url,
              created_at: createdAt,
              signature_download_url: signatureAsset?.browser_download_url ?? null,
              description: `Patches release ${tag}`,
              version: tag.replace(/^v/, ""),
            };

            fs.writeFileSync("manager-patches.json", `${JSON.stringify(payload, null, 2)}\n`);

      - name: Commit manager-patches.json
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          if git diff --quiet -- manager-patches.json; then
            echo "manager-patches.json is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manager-patches.json
          git commit -m "chore: update manager patches source [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest@v4
        with:
          subject-name: 'ReVanced Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.rvp
